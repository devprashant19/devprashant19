  <style>
    .h-g1 { animation: hD1 14s ease-in-out infinite alternate; }
    .h-g2 { animation: hD2 18s ease-in-out infinite alternate; }
    .h-r1 { transform-origin: 950px 205px; animation: hSpin 26s linear infinite; }
    .h-r2 { transform-origin: 950px 205px; animation: hSpin 40s linear infinite reverse; }
    .h-r3 { transform-origin: 950px 205px; animation: hSpin 60s linear infinite; }
    .h-core { transform-origin: 950px 205px; animation: hBreathe 5s ease-in-out infinite; }
    .h-path { stroke-dasharray: 1500; animation: hDraw 8s ease-in-out infinite; }
    .h-under { transform-origin: 70px 0; animation: hGrow 2.4s cubic-bezier(.2,.8,.2,1) both .6s; }
    .h-uglow { animation: hPulse 4s ease-in-out infinite; }
    .h-sheen { animation: hSweep 6s ease-in-out infinite 1.5s; }
    .h-rise { animation: hRise 1s ease-out both; } .h-d2 { animation-delay: .2s; } .h-d3 { animation-delay: .45s; } .h-d4 { animation-delay: .7s; }
    .h-tw { animation: hTw 4s ease-in-out infinite; }
    .h-node { animation: hPulse 3s ease-in-out infinite; }
    .h-scan { animation: hScan 9s linear infinite; }
    @keyframes hD1 { to { transform: translate(170px, 50px); } }
    @keyframes hD2 { to { transform: translate(-150px, -40px); } }
    @keyframes hSpin { to { transform: rotate(360deg); } }
    @keyframes hBreathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @keyframes hDraw { 0% { stroke-dashoffset: 1500; } 45%,75% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -1500; } }
    @keyframes hGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes hPulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes hSweep { 0% { transform: translateX(-260px); } 55%,100% { transform: translateX(760px); } }
    @keyframes hRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes hTw { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
    @keyframes hScan { from { transform: translateY(0); } to { transform: translateY(420px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
