<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" role="img" aria-labelledby="s01T">
<title id="s01T">01 ABOUT</title>
<defs>
  <linearGradient id="s01L" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3B8FE0"/><stop offset="1" stop-color="#7DB8F2" stop-opacity="0"/></linearGradient>
  <radialGradient id="s01G" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7DB8F2" stop-opacity="0.9"/><stop offset="1" stop-color="#7DB8F2" stop-opacity="0"/></radialGradient>
  <style>
    .s01-dot { animation: s01Run 4.5s cubic-bezier(.45,0,.2,1) infinite; }
    .s01-ln { transform-origin: 295px 0; animation: s01Grow 1.6s ease-out both; }
    .s01-in { animation: s01In .9s ease-out both; }
    @keyframes s01Run { 0% { transform: translateX(0); opacity: 0; } 12%,85% { opacity: 1; } 100% { transform: translateX(885px); opacity: 0; } }
    @keyframes s01Grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes s01In { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</defs>
<g class="s01-in">
  <text x="16" y="60" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="none" stroke="#3B8FE0" stroke-width="1.3">01</text>
  <circle cx="124" cy="45" r="4" fill="#3B8FE0"/>
  <text x="150" y="44" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="4" fill="#0B2A4A">ABOUT</text>
  <text x="151" y="70" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#5B7FA6">who I am and what I build</text>
</g>
<rect class="s01-ln" x="295" y="36" width="885" height="1.5" fill="url(#s01L)"/>
<g class="s01-dot"><circle cx="295" cy="36.75" r="12" fill="url(#s01G)"/><circle cx="295" cy="36.75" r="3" fill="#3B8FE0"/></g>
</svg>