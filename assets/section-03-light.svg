<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" role="img" aria-labelledby="s03T">
<title id="s03T">03 ACTIVITY</title>
<defs>
  <linearGradient id="s03L" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3B8FE0"/><stop offset="1" stop-color="#7DB8F2" stop-opacity="0"/></linearGradient>
  <radialGradient id="s03G" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7DB8F2" stop-opacity="0.9"/><stop offset="1" stop-color="#7DB8F2" stop-opacity="0"/></radialGradient>
  <style>
    .s03-dot { animation: s03Run 4.5s cubic-bezier(.45,0,.2,1) infinite; }
